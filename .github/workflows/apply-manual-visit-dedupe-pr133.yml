name: Apply Manual Visit Dedupe PR133
on:
  push:
    branches:
      - feature/manual-visit-dedupe-fix
jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch main baseline
        run: git fetch origin main
      - name: Apply manual visit dedupe
        run: python3 tools/apply-manual-visit-dedupe-pr133.py
      - name: Check inline JavaScript syntax
        run: node --check /tmp/app-inline.js
      - name: Run semantic manual visit tests
        run: node /tmp/manual-visit-dedupe-tests.js
      - name: Final static guard
        run: |
          grep -q "var BUILD_ID = '2026-08-15-k';" app.html
          grep -q "seenManualVisits" app.html
          grep -q "manualVisitN" app.html
          ! git diff -- app.html | grep -E "prague_exp_v10|prague_visited_v1|prague_days_v1|appdata/(expenses|main|trip_summary)" || exit 1
      - name: Commit app and docs only
        run: |
          git config user.name "arielshish"
          git config user.email "159256813+arielshish@users.noreply.github.com"
          git add app.html docs/TRIP_SUMMARY_MANUAL_VISIT_DEDUPE_PR133.md docs/CLAUDE_TRIP_SUMMARY_MANUAL_VISIT_DEDUPE_PR133.md
          git diff --cached --stat
          git commit -m "Dedupe duplicate manual trip summary visits"
          git push
