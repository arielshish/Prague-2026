name: Apply Trip Summary Selection Bank

on:
  push:
    branches:
      - feature/trip-summary-selection-bank
    paths:
      - tools/apply-trip-summary-selection-bank.py
      - .github/workflows/apply-trip-summary-selection-bank.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'Apply trip summary selection bank') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch main baseline
        run: git fetch origin main

      - name: Apply selection bank patch
        run: python3 tools/apply-trip-summary-selection-bank.py

      - name: Check inline JavaScript
        run: node --check /tmp/app-inline.js

      - name: Remove temporary workflow and script from final diff
        run: |
          rm -f tools/apply-trip-summary-selection-bank.py
          rm -f .github/workflows/apply-trip-summary-selection-bank.yml
          rmdir tools 2>/dev/null || true

      - name: Final diff guard
        run: |
          git diff --name-only | sort > /tmp/changed.txt
          cat /tmp/changed.txt
          grep -qx 'app.html' /tmp/changed.txt
          grep -qx 'docs/CLAUDE_TRIP_SUMMARY_SELECTION_BANK_PR129.md' /tmp/changed.txt
          grep -qx 'docs/TRIP_SUMMARY_SELECTION_BANK_PR129.md' /tmp/changed.txt
          if grep -E '(^backend|^gas_project|^translator.html|^robots.txt)' /tmp/changed.txt; then exit 1; fi

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html docs/CLAUDE_TRIP_SUMMARY_SELECTION_BANK_PR129.md docs/TRIP_SUMMARY_SELECTION_BANK_PR129.md
          git add -u
          git commit -m "Apply trip summary selection bank"
          git push origin feature/trip-summary-selection-bank
