name: Apply Missing Trip Coords

on:
  push:
    branches:
      - feature/missing-trip-summary-coords

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Apply missing coordinate aliases and validate
        run: |
          git fetch origin main
          python3 tools/apply-missing-trip-coords.py
          node --check /tmp/app-inline.js
      - name: Clean temporary files and commit final result
        run: |
          rm -f tools/audit-missing-trip-coords.py tools/apply-missing-trip-coords.py
          rm -f docs/MISSING_TRIP_COORDS_AUDIT.md docs/TARGETED_TRIP_COORDS_AUDIT.md
          rm -f .github/workflows/audit-missing-trip-coords.yml
          rm -f .github/workflows/apply-missing-trip-coords.yml
          git config user.name "arielshish"
          git config user.email "159256813+arielshish@users.noreply.github.com"
          git add app.html docs/TRIP_SUMMARY_COORD_ALIASES.md tools/audit-missing-trip-coords.py tools/apply-missing-trip-coords.py docs/MISSING_TRIP_COORDS_AUDIT.md docs/TARGETED_TRIP_COORDS_AUDIT.md .github/workflows/audit-missing-trip-coords.yml .github/workflows/apply-missing-trip-coords.yml
          git commit -m "Add trip summary coordinate aliases"
          git push
