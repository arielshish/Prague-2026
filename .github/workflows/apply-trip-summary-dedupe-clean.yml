name: Apply Trip Summary Dedupe Clean

on:
  push:
    branches:
      - feature/trip-summary-dedupe-clean

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'Add temporary clean dedupe workflow')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch main baseline
        run: git fetch origin main
      - name: Apply clean dedupe
        run: python tools/apply-trip-summary-dedupe-clean.py
      - name: Check inline JavaScript
        run: node --check /tmp/app-inline.js
      - name: Remove temporary workflow and script
        run: |
          rm -f tools/apply-trip-summary-dedupe-clean.py
          rm -f .github/workflows/apply-trip-summary-dedupe-clean.yml
          rmdir tools 2>/dev/null || true
      - name: Commit result
        run: |
          git config user.name "arielshish"
          git config user.email "159256813+arielshish@users.noreply.github.com"
          git add app.html docs .github tools || true
          git commit -m "Fix trip summary duplicate rows" || exit 1
          git push
