name: Apply Trip Summary Patch

on:
  push:
    branches:
      - feature/apphtml-trip-summary-readonly
    paths:
      - patches/trip-summary-readonly.patch
      - .github/workflows/apply-trip-summary-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/apphtml-trip-summary-readonly
          persist-credentials: true

      - name: Apply patch and validate
        run: |
          set -euo pipefail
          cp app.html /tmp/app.before.html
          git apply --check patches/trip-summary-readonly.patch
          git apply patches/trip-summary-readonly.patch
          python3 - <<'PY'
          from pathlib import Path
          before = Path('/tmp/app.before.html').read_text(encoding='utf-8')
          after = Path('app.html').read_text(encoding='utf-8')
          assert after.startswith('<!DOCTYPE html>')
          assert 'github.githubassets.com' not in after
          assert "var BUILD_ID = '2026-08-15-a';" in after
          assert "var BUILD_ID = '2026-08-14-g';" not in after
          for pattern in [
              'localStorage.setItem',
              'localStorage.removeItem',
              'localStorage.clear',
              'saveVisitedState',
              'saveDaysState',
              'saveLocal',
              'db.collection',
              'firebase.firestore'
          ]:
              if before.count(pattern) != after.count(pattern):
                  raise AssertionError(f'{pattern}: {before.count(pattern)} -> {after.count(pattern)}')
          PY
          rm -f patches/trip-summary-readonly.patch .github/workflows/apply-trip-summary-patch.yml
          rmdir patches 2>/dev/null || true

      - name: Commit final app.html-only change
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html patches .github/workflows/apply-trip-summary-patch.yml
          git status --short
          git commit -m "Fix read-only trip summary day mapping"
          git push origin HEAD:feature/apphtml-trip-summary-readonly
