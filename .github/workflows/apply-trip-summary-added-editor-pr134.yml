name: Apply Trip Summary Added Editor PR134
on:
  push:
    branches:
      - feature/trip-summary-added-editor
jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch main baseline
        run: git fetch origin main
      - name: Apply added-items editor fix
        run: python3 tools/apply-trip-summary-added-editor-pr134.py
      - name: Check inline JavaScript syntax
        run: node --check /tmp/app-inline.js
      - name: Run semantic added-items editor tests
        run: node /tmp/trip-summary-added-editor-tests.js
      - name: Final static guard
        run: |
          grep -q "var BUILD_ID = '2026-08-15-l';" app.html
          grep -q "tripSummaryManualSetAdded" app.html
          grep -q "tripSummaryManualRemoveAdded" app.html
          grep -q "פריטים שנוספו מבנק הבחירה" app.html
          ! git diff -- app.html | grep -E "prague_exp_v10|prague_visited_v1|prague_days_v1|appdata/(expenses|main|trip_summary)" || exit 1
      - name: Commit app and docs only
        run: |
          git config user.name "arielshish"
          git config user.email "159256813+arielshish@users.noreply.github.com"
          git add app.html docs/TRIP_SUMMARY_ADDED_EDITOR_PR134.md docs/CLAUDE_TRIP_SUMMARY_ADDED_EDITOR_PR134.md
          git diff --cached --stat
          git commit -m "Edit selection-bank trip summary items"
          git push
