name: Apply Reviewed Trip Coord Aliases

on:
  push:
    branches:
      - feature/missing-trip-summary-coords

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Apply reviewed coordinate aliases and validate
        run: |
          git fetch origin main
          python3 tools/add-reviewed-trip-coord-aliases.py
          node --check /tmp/app-inline.js
      - name: Clean temporary reviewed alias files and commit
        run: |
          rm -f tools/add-reviewed-trip-coord-aliases.py
          rm -f .github/workflows/apply-reviewed-trip-coord-aliases.yml
          rm -f tools/audit-trip-coords-full.py tools/audit-trip-coords-full-v2.py
          rm -f .github/workflows/full-trip-coords-audit.yml .github/workflows/full-trip-coords-audit-v2.yml
          git config user.name "arielshish"
          git config user.email "159256813+arielshish@users.noreply.github.com"
          git add app.html docs/TRIP_SUMMARY_COORD_ALIASES.md docs/FULL_TRIP_COORDS_AUDIT.md tools/add-reviewed-trip-coord-aliases.py .github/workflows/apply-reviewed-trip-coord-aliases.yml tools/audit-trip-coords-full.py tools/audit-trip-coords-full-v2.py .github/workflows/full-trip-coords-audit.yml .github/workflows/full-trip-coords-audit-v2.yml
          git commit -m "Add reviewed trip coordinate aliases"
          git push
