name: Apply Selection Bank Coordinate Sweep

on:
  push:
    branches:
      - feature/selection-bank-coordinate-sweep
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'Apply selection bank coordinate sweep') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch main baseline
        run: git fetch origin main
      - name: Apply coordinate sweep
        run: python3 tools/apply-selection-bank-coordinate-sweep.py
      - name: Check inline JavaScript
        run: node --check /tmp/app-inline.js
      - name: Remove temporary workflow and script from final diff
        run: |
          rm -f .github/workflows/apply-selection-bank-coordinate-sweep.yml
          rm -f tools/apply-selection-bank-coordinate-sweep.py
      - name: Final diff guard
        run: |
          git diff --name-only | sort > /tmp/changed.txt
          cat /tmp/changed.txt
          grep -qx 'app.html' /tmp/changed.txt
          grep -qx 'docs/CLAUDE_SELECTION_BANK_COORD_SWEEP_PR128.md' /tmp/changed.txt
          grep -qx 'docs/COORD_SWEEP_PR128_PLAN.md' /tmp/changed.txt
          grep -qx 'docs/SELECTION_BANK_COORD_SWEEP_PR128.md' /tmp/changed.txt
          ! grep -E '^\.github/workflows/|^tools/' /tmp/changed.txt
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply selection bank coordinate sweep" || echo "No changes"
          git push
