name: Apply Burger King Expense Draft PR132
on:
  push:
    branches:
      - feature/burger-king-expense-draft
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch main baseline
        run: git fetch origin main
      - name: Apply Burger King expense draft
        run: python3 tools/apply-burger-king-expense-draft.py
      - name: Check inline JavaScript
        run: node --check /tmp/app-inline.js
      - name: Remove temporary workflow and script
        run: |
          rm -f tools/apply-burger-king-expense-draft.py
          rm -f .github/workflows/apply-burger-king-expense-draft.yml
      - name: Commit result
        run: |
          git config user.name "arielshish"
          git config user.email "159256813+arielshish@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --quiet && exit 0
          git commit -m "Add Burger King expense draft"
          git push
