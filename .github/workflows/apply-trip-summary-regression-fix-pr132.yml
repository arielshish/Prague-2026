name: Apply Trip Summary Regression Fix PR132 Clean
on:
  push:
    branches:
      - feature/trip-summary-regression-fix-clean
jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch main baseline
        run: git fetch origin main
      - name: Apply regression fix
        run: python3 tools/apply-trip-summary-regression-fix-pr132c.py
      - name: Check inline JavaScript syntax
        run: node --check /tmp/app-inline.js
      - name: Run semantic regression tests
        run: node /tmp/trip-summary-regression-tests.js
      - name: Final static guard
        run: |
          grep -q "var BUILD_ID = '2026-08-15-j';" app.html
          grep -q "return 'manual-visit:'" app.html
          grep -q "function _lockTripSummaryOverlayScroll" app.html
          grep -q "Burger King — OC Eden" app.html
          grep -q "50.06780" app.html
          grep -q "14.47170" app.html
          ! git diff -- app.html | grep -E "prague_exp_v10|prague_visited_v1|prague_days_v1|appdata/(expenses|main|trip_summary)" || exit 1
      - name: Commit app and docs only
        run: |
          git config user.name "arielshish"
          git config user.email "159256813+arielshish@users.noreply.github.com"
          git add app.html docs/TRIP_SUMMARY_REGRESSION_FIX_PR132.md docs/CLAUDE_TRIP_SUMMARY_REGRESSION_FIX_PR132.md
          git diff --cached --stat
          git commit -m "Fix trip summary manual visits and overlay scroll"
          git push
