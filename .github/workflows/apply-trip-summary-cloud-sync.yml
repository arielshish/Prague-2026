name: Apply Trip Summary Cloud Sync

on:
  push:
    branches:
      - feature/trip-summary-cloud-sync

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Apply and validate PR126
        run: |
          git fetch origin main
          python3 tools/apply-pr126-cloud-sync.py
          node --check /tmp/app-inline.js
      - name: Validate diff scope and commit
        run: |
          git diff --name-only origin/main > /tmp/files.txt
          cat /tmp/files.txt
          python3 - <<'PY'
          from pathlib import Path
          files = set(Path('/tmp/files.txt').read_text().splitlines())
          required = {'app.html', 'docs/CLAUDE_TRIP_SUMMARY_CLOUD_SYNC.md'}
          allowed = required | {
            'tools/pr126-trip-summary-cloud-sync.patch',
            'tools/apply-pr126-cloud-sync.py',
            '.github/workflows/apply-trip-summary-cloud-sync.yml',
            '.github/workflows/apply-trip-summary-cloud-sync-v2.yml',
            '.github/workflows/apply-trip-summary-cloud-sync-v3.yml'
          }
          missing = required - files
          extra = files - allowed
          if missing or extra:
              print('missing:', sorted(missing))
              print('extra:', sorted(extra))
              raise SystemExit(1)
          PY
          rm -f tools/pr126-trip-summary-cloud-sync.patch
          rm -f tools/apply-pr126-cloud-sync.py
          rm -f .github/workflows/apply-trip-summary-cloud-sync.yml
          rm -f .github/workflows/apply-trip-summary-cloud-sync-v2.yml
          rm -f .github/workflows/apply-trip-summary-cloud-sync-v3.yml
          git config user.name "arielshish"
          git config user.email "159256813+arielshish@users.noreply.github.com"
          git add app.html docs/CLAUDE_TRIP_SUMMARY_CLOUD_SYNC.md tools/pr126-trip-summary-cloud-sync.patch tools/apply-pr126-cloud-sync.py .github/workflows/apply-trip-summary-cloud-sync.yml .github/workflows/apply-trip-summary-cloud-sync-v2.yml .github/workflows/apply-trip-summary-cloud-sync-v3.yml
          git commit -m "Sync trip summary overrides to Firestore"
          git push