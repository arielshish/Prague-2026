name: Apply Trip Summary Manual Overrides

on:
  push:
    branches:
      - feature/trip-summary-manual-overrides-local

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'arielshish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply focused patch
        run: |
          git apply tools/pr125-trip-summary-manual-overrides.patch
      - name: Validate safety boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          old = subprocess.check_output(['git','show','HEAD~2:app.html'], text=True)
          new = Path('app.html').read_text(encoding='utf-8')
          def count(s, needle): return s.count(needle)
          checks = []
          checks.append(('BUILD_ID', "var BUILD_ID = '2026-08-15-b';" in new))
          checks.append(('override key', 'prague_trip_summary_overrides_v1' in new and 'prague_trip_summary_overrides_ts' in new))
          checks.append(('no appdata main added', count(new, 'appdata/main') == count(old, 'appdata/main')))
          checks.append(('no appdata expenses added', count(new, 'appdata/expenses') == count(old, 'appdata/expenses')))
          checks.append(('no firestore doc added', count(new, "doc('appdata") == count(old, "doc('appdata")))
          checks.append(('localStorage writes only +2', count(new, 'localStorage.setItem') == count(old, 'localStorage.setItem') + 2))
          checks.append(('no remove/clear added', count(new, 'localStorage.removeItem') == count(old, 'localStorage.removeItem') and count(new, 'localStorage.clear') == count(old, 'localStorage.clear')))
          checks.append(('existing save functions untouched names present', all(x in new for x in ['function saveVisitedState', 'function saveDaysState', 'function saveLocal'])))
          bad = [name for name, ok in checks if not ok]
          if bad:
              print('FAILED:', bad)
              sys.exit(1)
          scripts = re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>', new, flags=re.S|re.I)
          Path('/tmp/app-inline.js').write_text('\n;\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/app-inline.js
      - name: Ensure final diff scope before cleanup
        run: |
          git diff --name-only HEAD~2..HEAD > /tmp/before.txt
          git diff --name-only HEAD~2 -- app.html | grep -qx app.html
      - name: Clean temporary files and commit final result
        run: |
          rm tools/pr125-trip-summary-manual-overrides.patch
          rm .github/workflows/apply-trip-summary-manual-overrides.yml
          git config user.name "arielshish"
          git config user.email "159256813+arielshish@users.noreply.github.com"
          git add app.html tools/pr125-trip-summary-manual-overrides.patch .github/workflows/apply-trip-summary-manual-overrides.yml
          git commit -m "Add local trip summary manual overrides"
          git push
